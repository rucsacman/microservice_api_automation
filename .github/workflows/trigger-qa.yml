name: Wait for QA

on:
  workflow_dispatch:

jobs:
  qa-check:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger QA repo workflow
        id: trigger
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: qa-workflow.yml
          repo: target-owner/target-repo
          token: ${{ secrets.PAT_TOKEN_FOR_QA }}
          ref: main

      - name: Wait for QA completion
        id: wait
        run: |
          run_id=""
          # fetch the latest run for this workflow
          while [ -z "$run_id" ]; do
            run_id=$(gh run list \
              --repo target-owner/target-repo \
              --workflow qa-workflow.yml \
              --json databaseId \
              --jq '.[0].databaseId')
            sleep 5
          done

          echo "QA Run ID: $run_id"

          status="in_progress"
          conclusion=""

          while [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; do
            data=$(gh run view $run_id \
              --repo target-owner/target-repo \
              --json status,conclusion)
            status=$(echo "$data" | jq -r '.status')
            conclusion=$(echo "$data" | jq -r '.conclusion')

            echo "Status: $status, Result: $conclusion"
            sleep 10
          done

          echo "final_result=$conclusion" >> $GITHUB_OUTPUT

        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN_FOR_QA }}

      - name: Fail if QA failed
        if: steps.wait.outputs.final_result != 'success'
        run: |
          echo "❌ QA failed"
          exit 1

      - name: Success
        if: steps.wait.outputs.final_result == 'success'
        run: |
          echo "✅ QA Passed"
