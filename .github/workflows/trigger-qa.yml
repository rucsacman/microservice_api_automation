name: Trigger QA Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dispatch-and-wait:
    runs-on: ubuntu-latest
    steps:
      # 1. Send the signal to start QA
      - name: Trigger QA Repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN_FOR_QA }}
          repository: rucsacman/qa_testing_automation
          event-type: trigger-api-tests
          client-payload: |
            {
              "ref": "${{ github.head_ref }}",
              "sha": "${{ github.event.pull_request.head.sha }}",
              "pr_number": "${{ github.event.number }}",
              "repo_name": "${{ github.repository }}",
              "actor": "${{ github.actor }}",
              "targetUrl": "https://staging-api.your-domain.com"
            }

      # 2. Wait for the result (Polling Script)
      - name: Wait for QA Result
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_FOR_QA }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # This context MUST match what is in your QA repo workflow
          CHECK_NAME: "QA / API Automation"
        run: |
          echo "🔎 Looking for status check: '$CHECK_NAME' on commit $SHA"
          echo "⏳ Waiting for QA to finish..."

          # Loop up to 100 times (100 * 10s = ~16 minutes timeout)
          for i in {1..100}; do
           
            # Use GitHub CLI to get the specific status of this commit
            STATUS=$(gh api "repos/$OWNER/$REPO/commits/$SHA/statuses" \
              --jq ".[] | select(.context == \"$CHECK_NAME\") | .state" | head -n 1)

            if [[ -z "$STATUS" ]]; then
              echo "   [$i] Status not found yet (QA might be starting)..."
            else
              echo "   [$i] Current QA Status: $STATUS"
            fi

            # Check if it succeeded
            if [[ "$STATUS" == "success" ]]; then
              echo "✅ QA Tests Passed Successfully!"
              exit 0
            fi

            # Check if it failed
            if [[ "$STATUS" == "failure" ]]; then
              echo "❌ QA Tests Failed!"
              exit 1
            fi

            # If pending or running, wait 10 seconds and try again
            sleep 10
          done

          echo "⏰ Timeout: QA tests took too long to report back."
          exit 1